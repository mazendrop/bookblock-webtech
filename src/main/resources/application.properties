spring.application.name=Bookblock
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/bookblock}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# Kleiner Connection-Pool: Renders kostenlose Postgres-DB erlaubt nur wenige
# gleichzeitige Verbindungen (siehe Troubleshooting-Folie im Auth-PDF).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Google Books API-Key kommt ausschliesslich aus der Umgebungsvariable
# GOOGLE_BOOKS_API_KEY (in Render gesetzt). Kein Key im Code/Repo.
google.books.api-key=${GOOGLE_BOOKS_API_KEY:}

# --- Auth (Okta / OIDC) ---
# Das Backend prueft Okta-JWTs. Die Issuer-URL kommt aus der Umgebungsvariable
# OKTA_ISSUER (z. B. https://dev-XXdusername.okta.com/oauth2/default).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OKTA_ISSUER}
# Erlaubte Frontend-Herkunft fuer CORS (Render-Frontend-URL). Lokal: localhost.
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}
