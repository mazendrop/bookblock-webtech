# Test-Konfiguration: laeuft komplett lokal, ohne echtes Okta und ohne Postgres.
# In-Memory-H2 statt Datei/Postgres
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Dummy-Issuer: wird nie kontaktiert, weil die Tests einen Mock-JwtDecoder
# bereitstellen. Er sorgt nur dafuer, dass die Platzhalter aufgeloest werden.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://test.example.com/oauth2/default
app.cors.allowed-origins=http://localhost:5173
google.books.api-key=
