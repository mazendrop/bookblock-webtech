# Test-Konfiguration: laeuft komplett lokal, ohne Postgres.
# In-Memory-H2 statt Datei/Postgres
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Fester Test-Schluessel (nur fuer Tests, mind. 32 Zeichen).
app.jwt.secret=test-secret-key-fuer-junit-tests-1234567890
app.cors.allowed-origins=http://localhost:5173
